    def at = file("src/main/resources/${accessWidenerVersion}.${mod_id}.accesstransformer.cfg")
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    validateAccessTransformers = true

    //runs {
    //    client {
    //        client()
    //    }
    //    data {
    //        data()
    //    }
    //    server {
    //        server()
    //    }
    //}
//

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

//sourceSets {
//    commonSource {
//        java {
//            srcDirs = [project(':common').file('src/main/java')]
//        }
//    }
