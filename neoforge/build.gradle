plugins {
    id 'net.neoforged.moddev' version '2.0.143'
}

neoForge {
    version = rootProject.neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(":common").file("src/main/resources/${accessWidenerVersion}.${rootProject.mod_id}.accesstransformer.cfg")
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    if (rootProject.minecraft_version.startsWith("1")) {
        parchment {
            minecraftVersion = rootProject.parchment_minecraft
            mappingsVersion = rootProject.parchment_version
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

mainJarTask().configure {
    if (it.hasProperty('inputFile')) {
        it.inputFile = shadowJar.archiveFile
    }
    else {
        from(zipTree(shadowJar.archiveFile)) {
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
    dependsOn shadowJar
//    classifier null

    //accessTransformers.add("${rootProject.mod_id}.accesstransformer.cfg")
}

configurations {
    // The addModJar basically embeds the mod to the built jar
    addModJar
    include.extendsFrom addModJar
    implementation.extendsFrom addModJar
}

def addMod(path, enabled) {
    if (enabled == "2")
        dependencies { implementation(path) }
    else if (enabled == "1")
        dependencies { modCompileOnly(path) }
}

dependencies {
    api "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_api_neoforge_version}"

    if (rootProject.enable_xaeros_minimap == "true") {
        if (rootProject.hasProperty("xaeros_minimap_neoforge_version") && rootProject.xaeros_minimap_neoforge_version != "") {
            implementation "xaero.minimap:xaerominimap-neoforge-${rootProject.minecraft_version}:${rootProject.xaeros_minimap_neoforge_version}"
        } else {
            implementation "xaero.minimap:xaerominimap-neoforge-${rootProject.minecraft_version}:${rootProject.default_xaeros_minimap_version}"
        }
    } else {
        if (rootProject.hasProperty("xaeros_minimap_neoforge_version") && rootProject.xaeros_minimap_neoforge_version != "") {
            compileOnly "xaero.minimap:xaerominimap-neoforge-${rootProject.minecraft_version}:${rootProject.xaeros_minimap_neoforge_version}"
        } else {
            compileOnly "xaero.minimap:xaerominimap-neoforge-${rootProject.minecraft_version}:${rootProject.default_xaeros_minimap_version}"
        }
    }
    if (rootProject.enable_xaeros_worldmap == "true") {
        if (rootProject.hasProperty("xaeros_worldmap_neoforge_version") && rootProject.xaeros_worldmap_neoforge_version != "") {
            implementation "xaero.map:xaeroworldmap-neoforge-${rootProject.minecraft_version}:${rootProject.xaeros_worldmap_neoforge_version}"
        } else {
            implementation "xaero.map:xaeroworldmap-neoforge-${rootProject.minecraft_version}:${rootProject.default_xaeros_worldmap_version}"
        }
    } else {
        if (rootProject.hasProperty("xaeros_worldmap_neoforge_version") && rootProject.xaeros_worldmap_neoforge_version != "") {
            compileOnly "xaero.map:xaeroworldmap-neoforge-${rootProject.minecraft_version}:${rootProject.xaeros_worldmap_neoforge_version}"
        } else {
            compileOnly "xaero.map:xaeroworldmap-neoforge-${rootProject.minecraft_version}:${rootProject.default_xaeros_worldmap_version}"
        }
    }
    compileOnly "xaero.lib:xaerolib-neoforge-${rootProject.minecraft_version}:${rootProject.xaero_lib_version}"
}

tasks.register('deleteResources', Delete) {
    delete file("build/resources/main")
}

tasks.register('copyAllResources') {
    dependsOn(tasks.named("copyCoreResources"))
    dependsOn(tasks.named("copyAccesstransformerResources"))
}

processResources {
    dependsOn(tasks.named('copyAllResources'))
    exclude "*.accesswidener"
}

publishMods {
    file = mainJarTask().archiveFile
    dryRun = publish_debug_mode.toBoolean()
    changelog = file("$rootDir/docs/changelogs/${mod_version}.md").text.trim()
    version = mod_version
    switch (release_type) {
        case "alpha":
            type = ALPHA
            break
        case "beta":
            type = BETA
            break
        case "stable":
            type = STABLE
            break
    }

    displayName = "[NeoForge | ${rootProject.file_name}] ${mod_version}"

    modLoaders.add("neoforge")

    String gameVersionsString = rootProject.compatible_minecraft_versions
    String[] gameVersions = gameVersionsString.replace("[", "").replace("]", "").replaceAll(" ", "").replaceAll("\"", "").split(",")

    if (publish_to_modrinth.toBoolean()) {
        modrinth {
            accessToken = providers.environmentVariable("MODRINTH_TOKEN")
            projectId = modrinth_id
            minecraftVersions.addAll(gameVersions)

            requires("cloth-config")
            optional("xaeros-minimap", "xaeros-minimap-fair", "xaeros-world-map")
        }
    }

    if (publish_to_curseforge.toBoolean()) {
        curseforge {
            accessToken = providers.environmentVariable("CURSE_TOKEN")
            projectId = curseforge_id
            if (curse_environment == "both" || curse_environment == "server") serverRequired = true
            if (curse_environment == "both" || curse_environment == "client") clientRequired = true
            minecraftVersions.addAll(gameVersions)

            requires("cloth-config")
            optional("xaeros-minimap", "xaeros-minimap-fair-play-edition", "xaeros-world-map")
        }
    }
}

